################################################################################
# Ngrok Service
#
# Exposes the Splash Toolkit (toolkit.shopify.local) on a public HTTPS URL so
# that Shopify can reach local Webhooks / OAuth callbacks during development.
#
# Requires NGROK_AUTHTOKEN to be set in the project .env file.
# Web inspector available on http://localhost:4040
#
################################################################################

services:
    ################################################################################
    # Ngrok Tunnel Container
    ngrok:
        image:          ngrok/ngrok:latest
        container_name: ngrok.shopify.local
        command:          http toolkit:80 --url=lemur-touching-anchovy.ngrok-free.app
        environment:
            NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
        ports:
            # Ngrok local web inspector
            - "4040:4040"
        depends_on:
            - toolkit
        networks:
            shopify:        { aliases: [ ngrok.shopify.local ] }