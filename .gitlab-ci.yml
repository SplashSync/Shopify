################################################################
# Include Pipeline Templates
include:
  - remote: 'https://raw.githubusercontent.com/BadPixxel/Php-Sdk/2.0/gitlab/php/connectors.yaml'

################################################################
# Defined Pipeline Stages
stages:
  - Quality
  - Builds
  - Functional

#################################################################
# Quality Tests
#################################################################

quality:php-8.2:
  when: manual

#################################################################
# Functional Tests
#################################################################

functional:php-8.1:
  when: manual

functional:php-8.2:
  when: manual

################################################################################
# Functional Tests - ThirdParty & Address
functional:customers:
    extends:            functional:php-8.1
    when:               always
    variables:
        SPLASH_TYPES:   "ThirdParty,Address"

################################################################################
# Functional Tests - Products
functional:products:
    extends:            functional:php-8.1
    when:               always
    needs:
        - functional:customers
    variables:
        SPLASH_TYPES:   "Product"

################################################################################
# Functional Tests - Orders & Invoices
functional:orders:
    extends:            functional:php-8.1
    when:               always
    needs:
        - functional:customers
        - functional:products
    variables:
        SPLASH_TYPES:   "Order,Invoice"

################################################################
# Build Bridge Connector via Bridge Builder
# --publish uploads .splx/.phar to the GitLab Generic Package Registry
# (skipped on scheduled pipelines, non-protected branches, or missing CI env)
build:bridge:
    image:          registry.gitlab.com/badpixxel-projects/php-sdk:php-8.3
    stage:          Builds
    tags:
        - Dedicated
    before_script:
        - composer update
    script:
        # Build native variant (produces shopify.splx)
        - php -d phar.readonly=0 vendor/bin/bridge-builder --native
        # Build versioned variant (produces shopify-2.0.splx) and publish all dist/*.splx at once
        - php -d phar.readonly=0 vendor/bin/bridge-builder --publish
    artifacts:
        paths:
            - dist/
        expire_in:  1 week
